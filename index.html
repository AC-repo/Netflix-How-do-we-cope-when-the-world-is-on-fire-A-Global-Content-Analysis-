<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e50914">
    <meta name="description" content="Analyze global Netflix content trends and political influences">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Netflix Analysis">
    
    <title>Netflix Content Analysis</title>
    
    <link rel="icon" type="image/svg+xml" href="/images/icon.svg">
    <link rel="apple-touch-icon" href="/images/icon-192.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="manifest" href="/manifest.json">
    
    <!-- Load Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <!-- Load our application code -->
    <script type="module" src="/js/main.js"></script>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <nav class="sidebar" role="navigation" aria-label="Main navigation">
        <div class="sidebar-header">
            <h1>Netflix Analysis</h1>
        </div>
        <div class="sidebar-content">
            <h2 class="sr-only">Navigation Menu</h2>
            <div class="nav-section">
                <h3>Countries</h3>
                <div id="country-list" role="list" aria-label="Country list"></div>
            </div>
        </div>
    </nav>

    <main class="content" id="main-content" role="main">
        <!-- Global Metrics Cards -->
        <section class="metrics-overview">
            <div class="metric-card">
                <h3>Most Escapist Country</h3>
                <div id="most-escapist-country" class="metric-value"></div>
                <div id="most-escapist-score" class="metric-score"></div>
            </div>
            <div class="metric-card">
                <h3>Most Reality-Based Country</h3>
                <div id="most-reality-country" class="metric-value"></div>
                <div id="most-reality-score" class="metric-score"></div>
            </div>
            <div class="metric-card">
                <h3>COVID-19 Impact</h3>
                <div id="covid-impact-score" class="metric-value">72.0%</div>
                <div class="metric-trend">Trend: increasing</div>
            </div>
        </section>

        <!-- Global Visualizations -->
        <section class="visualizations">
            <div id="global-heatmap" class="visualization">
                <h2>Global Content Distribution</h2>
                <div class="chart-container"></div>
            </div>
        </section>
    </main>

    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const registration = await navigator.serviceWorker.register('/sw.js', {
                        scope: '/'
                    });
                    console.log('ServiceWorker registration successful:', registration);
                    
                    // Handle updates
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        console.log('Service Worker update found!');
                        
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('New content is available; please refresh.');
                            }
                        });
                    });
                } catch (error) {
                    console.error('ServiceWorker registration failed:', error);
                }
            });

            // Handle communication with SW
            navigator.serviceWorker.addEventListener('message', (event) => {
                if (event.data.type === 'CACHE_UPDATED') {
                    console.log('New content is available; please refresh.');
                }
            });
        }
    </script>
</body>
</html>
